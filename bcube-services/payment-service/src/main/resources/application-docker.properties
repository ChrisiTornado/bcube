spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.flyway.baseline-on-migrate=true

booking-service.base-url=${BOOKING_SERVICE_BASE_URL:http://booking-service:8083/api/bookings}
notification-service.base-url=${NOTIFICATION_SERVICE_BASE_URL:http://user-service:8081/api/notifications}
user-service.base-url=${USER_SERVICE_BASE_URL:http://user-service:8081/api/users}

# JSON logs in containers (includes the requestId MDC entry) for CloudWatch/log tooling.
logging.structured.format.console=ecs
