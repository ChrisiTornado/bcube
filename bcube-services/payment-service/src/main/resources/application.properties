spring.application.name=payment-service
server.port=8085
# Lets a rolling deploy finish in-flight requests instead of dropping them mid-response.
server.shutdown=graceful

# Database config
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5437/bcube_payment_service
spring.datasource.username=admin
spring.datasource.password=admin

# Hibernate config
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
# Off by default (perf + keeps query/data shape out of prod logs) - set SHOW_SQL=true locally if
# you need to debug a query.
spring.jpa.show-sql=${SHOW_SQL:false}

# JWT config (shared secret across every service)
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# Inter-service
frontend.url=http://localhost:4200
booking-service.base-url=http://localhost:8083/api/bookings
notification-service.base-url=http://localhost:8081/api/notifications
user-service.base-url=${USER_SERVICE_BASE_URL:http://localhost:8081/api/users}
internal.service-key=${INTERNAL_SERVICE_KEY}

# Stripe - test vs. live is purely which secret value is deployed here, no mode flag in code
stripe.api.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# Welcome voucher
welcome-voucher.code=WELCOME2H
welcome-voucher.free-hours=2
welcome-voucher.validity-days=90
