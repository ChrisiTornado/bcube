spring.application.name=payment-service
server.port=8085

# Database config
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5437/bcube_payment_service
spring.datasource.username=admin
spring.datasource.password=admin

# Hibernate config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT config (shared secret across every service)
jwt.
jwt.expiration=3600000

# Inter-service
booking-service.base-url=http://localhost:8083/api/bookings
internal.service-key=${INTERNAL_SERVICE_KEY}

# Stripe - test vs. live is purely which secret value is deployed here, no mode flag in code
stripe.api.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# Welcome voucher
welcome-voucher.code=WELCOME2H
welcome-voucher.free-hours=2
welcome-voucher.validity-days=90
