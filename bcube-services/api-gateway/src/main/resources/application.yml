server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: admin-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/admin/users/**

        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**

        - id: studio-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/studios/**

        - id: booking-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/bookings/**

        - id: access-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/access/**

      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

jwt:
  secret: ${jwt.secret}