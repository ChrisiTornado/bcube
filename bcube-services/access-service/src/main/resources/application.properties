spring.application.name=access-service
server.port=8084
# Lets a rolling deploy finish in-flight requests instead of dropping them mid-response.
server.shutdown=graceful

# Database config
spring.datasource.driver-class-name = org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5436/bcube_access_service
spring.datasource.username=admin
spring.datasource.password=admin

# Hibernate config
spring.jpa.hibernate.ddl-auto=update
# Off by default (perf + keeps query/data shape out of prod logs) - set SHOW_SQL=true locally if
# you need to debug a query.
spring.jpa.show-sql=${SHOW_SQL:false}

# URLs
frontend.url=${FRONTEND_URL:http://localhost:4200}

# Shared secret authenticating booking-service's server-to-server calls to /api/access/** - see
# AccessController and WebSecurityConfig for why this replaces JWT auth entirely on this service.
internal.service-key=${INTERNAL_SERVICE_KEY}

# crypto key
base64-key=${ACCESS_AES_KEY}

# nuki
nuki.url=https://api.nuki.io/
nuki.api.token=${NUKI_API_TOKEN}
# TEMPORARY until launch: set back to false (or remove) once Nuki is reactivated for real testing.
nuki.mock-enabled=true