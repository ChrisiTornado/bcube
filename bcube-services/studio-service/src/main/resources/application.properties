spring.application.name=studio-service
server.port=8082
# Lets a rolling deploy finish in-flight requests instead of dropping them mid-response.
server.shutdown=graceful

# Database config
spring.datasource.driver-class-name = org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5434/bcube_studio_service
spring.datasource.username=admin
spring.datasource.password=admin

# Hibernate config
spring.jpa.hibernate.ddl-auto=update
# Off by default (perf + keeps query/data shape out of prod logs) - set SHOW_SQL=true locally if
# you need to debug a query.
spring.jpa.show-sql=${SHOW_SQL:false}

# JWT config
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# URLs
frontend.url=${FRONTEND_URL:http://localhost:4200}

# Smartlock – Nuki smartlock ID that is assigned to all seeded studios
studio.default.smartlock-id=1

# Microservices paths - env-var-driven with the current local value as default, so AWS just needs
# to set the env var (real domain/service-discovery name) with no further code changes.
booking-service.base-url=${BOOKING_SERVICE_BASE_URL:http://localhost:8083/api/bookings}