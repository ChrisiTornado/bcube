spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.flyway.baseline-on-migrate=true

booking-service.base-url=${BOOKING_SERVICE_BASE_URL:http://booking-service:8083/api/bookings}

aws.s3.region=${AWS_S3_REGION:eu-central-1}
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.s3.public-url-base=${AWS_S3_PUBLIC_URL_BASE:}

# JSON logs in containers (includes the requestId MDC entry) for CloudWatch/log tooling.
logging.structured.format.console=ecs

springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:false}
