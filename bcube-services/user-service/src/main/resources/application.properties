spring.application.name=user-service
server.port=8081
# Lets a rolling deploy finish in-flight requests instead of dropping them mid-response.
server.shutdown=graceful
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=false
# Database config
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5433/bcube_user_service
spring.datasource.username=admin
spring.datasource.password=admin
# Hibernate config
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
# Off by default (perf + keeps query/data shape out of prod logs) - set SHOW_SQL=true locally if
# you need to debug a query.
spring.jpa.show-sql=${SHOW_SQL:false}
# JWT config
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
# URLs - env-var-driven with the current local values as defaults, so AWS just needs to set the
# env vars (real domains/service-discovery names) with no further code changes.
frontend.url=${FRONTEND_URL:http://localhost:4200}

# Google Sign-In (OAuth2 login, fronted by the api-gateway on :8080 locally). redirect-uri must
# exactly match a redirect URI authorized in the Google Cloud Console OAuth client - add the prod
# one there before setting OAUTH_REDIRECT_URI to it.
spring.security.oauth2.client.registration.google.client-id=793706967497-rsb3uicrn0fsii4n23m8bq193p2sbpcj.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${OAUTH_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
server.forward-headers-strategy=framework
# Admin bootstrap - if either is unset, AdminInitializer logs a warning and skips seeding
# instead of falling back to a guessable default.
admin.email=${ADMIN_BOOTSTRAP_EMAIL:}
admin.password=${ADMIN_BOOTSTRAP_PASSWORD:}
# Microservices paths
payment-service.base-url=${PAYMENT_SERVICE_BASE_URL:http://localhost:8085/api/payments}
booking-service.base-url=${BOOKING_SERVICE_BASE_URL:http://localhost:8083/api/bookings}

# Shared secret used by other services to call the internal /api/notifications/** endpoints
internal.service-key=${INTERNAL_SERVICE_KEY}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true