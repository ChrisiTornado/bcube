<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Willkommen bei bcube</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;padding:32px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background-color:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #ececec;">
        <tr>
          <td style="padding:32px 40px 24px;border-bottom:1px solid #f0f0f0;">
            <span style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:800;letter-spacing:1px;color:#111111;">CUBE</span>
          </td>
        </tr>
        <tr>
          <td style="padding:40px;font-family:Arial,Helvetica,sans-serif;color:#1f1f1f;">
            <h1 style="margin:0 0 16px;font-size:22px;line-height:1.3;color:#111111;">
              Willkommen, <span th:text="${firstName}">Christophe</span>!
            </h1>
            <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#3f3f3f;">
              Schön, dass du bei bcube dabei bist. Dein Account ist startklar – du kannst ab sofort Cubes in Wien entdecken und direkt online buchen.
            </p>
            <table role="presentation" cellpadding="0" cellspacing="0">
              <tr>
                <td style="border-radius:10px;background-color:#ffa722;">
                  <a th:href="${appUrl}" style="display:inline-block;padding:13px 26px;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;color:#111111;text-decoration:none;">
                    Jetzt Cube entdecken
                  </a>
                </td>
              </tr>
            </table>
            <p style="margin:28px 0 0;font-size:14px;line-height:1.6;color:#6b6b6b;">
              Bei Fragen sind wir jederzeit für dich da.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 40px 32px;border-top:1px solid #f0f0f0;">
            <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#9a9a9a;">bcube · Wien · Diese E-Mail wurde automatisch generiert.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
