spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.flyway.baseline-on-migrate=true

user-service.base-url=${USER_SERVICE_BASE_URL:http://user-service:8081/api/users}
studio-service.base-url=${STUDIO_SERVICE_BASE_URL:http://studio-service:8082/api/studios}
access-service.base-url=${ACCESS_SERVICE_BASE_URL:http://access-service:8084/api/access}
payment-service.base-url=${PAYMENT_SERVICE_BASE_URL:http://payment-service:8085/api/payments}
notification-service.base-url=${NOTIFICATION_SERVICE_BASE_URL:http://user-service:8081/api/notifications}
internal.service-key=${INTERNAL_SERVICE_KEY}

# JSON logs in containers (includes the requestId MDC entry) for CloudWatch/log tooling.
logging.structured.format.console=ecs

springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:false}
