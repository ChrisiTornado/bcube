spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.flyway.baseline-on-migrate=true

user-service.base-url=http://user-service:8081/api/users
studio-service.base-url=http://studio-service:8082/api/studios
payment-service.base-url=http://payment-service:8085/api/payments
notification-service.base-url=http://user-service:8081/api/notifications
internal.service-key=${INTERNAL_SERVICE_KEY}