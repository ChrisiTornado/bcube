spring.application.name=booking-service
booking.status.scheduler.delay-ms=300000
booking.reminder.scheduler.delay-ms=900000
server.port=8083
# Lets a rolling deploy finish in-flight requests instead of dropping them mid-response.
server.shutdown=graceful

# Database config
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5435/bcube_booking_service
spring.datasource.username=admin
spring.datasource.password=admin

# Hibernate config
spring.jpa.hibernate.ddl-auto=update
# Off by default (perf + keeps query/data shape out of prod logs) - set SHOW_SQL=true locally if
# you need to debug a query.
spring.jpa.show-sql=${SHOW_SQL:false}

# JWT config
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# URLs
frontend.url=${FRONTEND_URL:http://localhost:4200}

# Microservices paths - env-var-driven with the current local values as defaults, so AWS just
# needs to set the env vars (real domains/service-discovery names) with no further code changes.
user-service.base-url=${USER_SERVICE_BASE_URL:http://localhost:8081/api/users}
studio-service.base-url=${STUDIO_SERVICE_BASE_URL:http://localhost:8082/api/studios}
access-service.base-url=${ACCESS_SERVICE_BASE_URL:http://localhost:8084/api/access}
payment-service.base-url=${PAYMENT_SERVICE_BASE_URL:http://localhost:8085/api/payments}
notification-service.base-url=${NOTIFICATION_SERVICE_BASE_URL:http://localhost:8081/api/notifications}

# Shared secret authenticating the payment-service webhook's callback to PATCH /{id}/payment-status
internal.service-key=${INTERNAL_SERVICE_KEY}
