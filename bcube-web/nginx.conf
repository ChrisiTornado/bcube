server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers. connect-src covers same-origin API calls (proxied below) plus
  # Mapbox, which the browser calls directly for map tiles/styles.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.mapbox.com; connect-src 'self' https://*.mapbox.com; worker-src 'self' blob:; frame-ancestors 'none'" always;

  # Reverse-proxies same-origin /api/ calls to the api-gateway service on the docker
  # network - update the host:port below to match the actual api-gateway deployment.
  location /api/ {
    proxy_pass http://api-gateway:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: GZIP-Kompression aktivieren
  gzip on;
  gzip_types text/plain application/javascript text/css application/json;
}
