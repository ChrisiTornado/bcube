<p-toast key="main" position="top-right"></p-toast>
<p-confirmDialog></p-confirmDialog>

<!-- Titelzeile -->
<header class="user-header">
  <div class="header-brand">
    <img 
      src="assets/images/nice.jpg" 
      alt="bcube logo" 
      class="dashboard-logo"
    />
    <span class="brand-text">cube</span>
  </div>

  <p-megaMenu
    [model]="items"
    styleClass="user-top-menu">
  </p-megaMenu>

  @if (isLoggedIn) {
    <a class="profile-avatar-button" routerLink="/profile" aria-label="Zum Profil">
      <span>{{ avatarLabel }}</span>
    </a>
  } @else {
    <div class="guest-auth-actions">
      <a class="guest-auth-button guest-auth-button-secondary" routerLink="/register" [queryParams]="authQueryParams">
        Registrieren
      </a>
      <a class="guest-auth-button guest-auth-button-primary" routerLink="/login" [queryParams]="authQueryParams">
        <i class="pi pi-sign-in"></i>
        Anmelden
      </a>
    </div>
  }
</header>

<div class="user-layout">
  <div class="page-content">
    <router-outlet></router-outlet>
  </div>
</div>
