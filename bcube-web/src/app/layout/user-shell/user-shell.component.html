<p-toast key="main" position="top-right"></p-toast>
<p-confirmDialog></p-confirmDialog>

<!-- Titelzeile -->
<header class="user-header">
  <div class="header-brand">
    <img 
      src="assets/images/nice.jpg" 
      alt="bcube logo" 
      class="dashboard-logo"
    />
    <span class="brand-text">cube</span>
  </div>

  <p-megaMenu
    [model]="items"
    styleClass="user-top-menu">
  </p-megaMenu>

  <a class="profile-avatar-button" routerLink="/user-dashboard/profile" aria-label="Zum Profil">
    <span>{{ avatarLabel }}</span>
  </a>
</header>

<div class="user-layout">
  <div class="page-content">
    <router-outlet></router-outlet>
  </div>
</div>
