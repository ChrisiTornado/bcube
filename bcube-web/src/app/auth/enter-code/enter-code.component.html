<p-toast position="top-right"></p-toast>
<p-confirmDialog></p-confirmDialog>
<app-auth-container [title]="'Geben Sie den 6-stelligen Code ein'">
    <form [formGroup]="formGroup" class="enter-code-form">
        <div class="flex justify-content-center mb-3">
            <input id="digit1" type="text" formControlName="digit1" maxlength="1" class="code-input"
                (input)="moveFocus($event, 'digit2')" />

            <input id="digit2" type="text" formControlName="digit2" maxlength="1" class="code-input"
                (input)="moveFocus($event, 'digit3')" />

            <input id="digit3" type="text" formControlName="digit3" maxlength="1" class="code-input"
                (input)="moveFocus($event, 'digit4')" />

            <input id="digit4" type="text" formControlName="digit4" maxlength="1" class="code-input"
                (input)="moveFocus($event, 'digit5')" />

            <input id="digit5" type="text" formControlName="digit5" maxlength="1" class="code-input"
                (input)="moveFocus($event, 'digit6')" />

            <input id="digit6" type="text" formControlName="digit6" maxlength="1" class="code-input" />
        </div>

        <div *ngIf="submitted && formGroup.invalid" class="p-error mb-3 justify-content-center">
            Bitte geben Sie alle 6 Ziffern des Codes ein.
        </div>

        <div class="card flex justify-content-between align-items-center mt-4 code-actions">
            <p-button pRipple label="Zurück" icon="pi pi-arrow-left" class="p-button-text text-900" (click)="goBack()"
                [style]="darkButtonStyle"></p-button>

            <p-button pRipple label="Code erneut senden" [disabled]="resendCodeLoading" [loading]="resendCodeLoading" class="p-button-text text-900 code-action-button"
                (click)="resendCode()"
                [style]="{'background-color': 'white', 'border-color': 'black', 'color': 'black'}"></p-button>

            <p-button pRipple type="button" [disabled]="loading" label="Code verifizieren" [loading]="loading" (click)="submit()"
                class="code-action-button bg-red-600 text-white"
                [style]="darkButtonStyle"></p-button>
        </div>
    </form>
</app-auth-container>
<p-toast></p-toast>
