<div class="card flex justify-content-center">
  <p-button (click)="openDialog()" icon="pi pi-pencil" [style]="darkButtonStyle" ariaLabel="User bearbeiten"></p-button>

  <p-dialog header="Benutzer aktualisieren" [(visible)]="visible" [modal]="true" [style]="{ width: '50vw' }"
    [draggable]="false" [resizable]="false" (onHide)="closeDialog()">
    <form [formGroup]="updateForm" class="user-update-form">
      <app-user-form-fields [form]="updateForm" [submitted]="submitted"></app-user-form-fields>

      <div class="flex justify-content-end">
        <p-button [style]="darkButtonStyle"(click)="submit()" pRipple label="Speichern" [loading]="loading"
        icon="pi pi-save" styleClass="p-button-primary"></p-button>
      </div>
    </form>
  </p-dialog>
</div>
