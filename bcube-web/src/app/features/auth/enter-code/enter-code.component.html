<p-toast position="top-right"></p-toast>
<p-confirmDialog></p-confirmDialog>
<app-auth-container [title]="'Geben Sie den 6-stelligen Code ein'">
  @if (email) {
    <p class="enter-code-subtitle">
      Wir haben einen Code an <strong>{{ email }}</strong> gesendet.
    </p>
  }
  <form [formGroup]="formGroup" class="enter-code-form">
    <div class="flex justify-content-center mb-3">
      <input id="digit1" type="text" inputmode="numeric" formControlName="digit1" maxlength="1" class="code-input"
        (input)="moveFocus($event, 'digit2')" (keydown)="handleBackspace($event, null)" (paste)="handlePaste($event)" />

        <input id="digit2" type="text" inputmode="numeric" formControlName="digit2" maxlength="1" class="code-input"
          (input)="moveFocus($event, 'digit3')" (keydown)="handleBackspace($event, 'digit1')" (paste)="handlePaste($event)" />

          <input id="digit3" type="text" inputmode="numeric" formControlName="digit3" maxlength="1" class="code-input"
            (input)="moveFocus($event, 'digit4')" (keydown)="handleBackspace($event, 'digit2')" (paste)="handlePaste($event)" />

            <input id="digit4" type="text" inputmode="numeric" formControlName="digit4" maxlength="1" class="code-input"
              (input)="moveFocus($event, 'digit5')" (keydown)="handleBackspace($event, 'digit3')" (paste)="handlePaste($event)" />

              <input id="digit5" type="text" inputmode="numeric" formControlName="digit5" maxlength="1" class="code-input"
                (input)="moveFocus($event, 'digit6')" (keydown)="handleBackspace($event, 'digit4')" (paste)="handlePaste($event)" />

                <input id="digit6" type="text" inputmode="numeric" formControlName="digit6" maxlength="1" class="code-input"
                  (keydown)="handleBackspace($event, 'digit5')" (paste)="handlePaste($event)" />
              </div>

              @if (submitted && formGroup.invalid) {
                <div class="p-error mb-3 justify-content-center">
                  Bitte geben Sie alle 6 Ziffern des Codes ein.
                </div>
              }

              <div class="card flex justify-content-between align-items-center mt-4 code-actions">
                <p-button pRipple label="Zurück" icon="pi pi-arrow-left" class="p-button-text text-900" (click)="goBack()"
                [style]="darkButtonStyle"></p-button>

                <p-button pRipple label="Code erneut senden" [disabled]="resendCodeLoading" [loading]="resendCodeLoading" class="p-button-text text-900 code-action-button"
                  (click)="resendCode()"
                [style]="lightButtonStyle"></p-button>

                <p-button pRipple type="button" [disabled]="loading" label="Code verifizieren" [loading]="loading" (click)="submit()"
                  class="code-action-button bg-red-600 text-white"
                [style]="darkButtonStyle"></p-button>
              </div>
            </form>
          </app-auth-container>
          <p-toast></p-toast>
