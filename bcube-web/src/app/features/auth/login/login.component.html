<app-auth-container [title]="''">
  <div class="login-hero">
    <div class="login-brand-badge">
      <img src="assets/images/nice.jpg" alt="bcube logo" class="login-brand-logo">
      <span class="login-brand-text">cube</span>
    </div>
  </div>
  <div class="login-local-title-wrap">
    <h1 class="login-screen-title m-0">Anmelden</h1>
  </div>
  @if (!loading) {
    <form [formGroup]="loginForm" class="login-form">
      <div class="mb-4 login-field">
        <label for="email" class="block text-900 font-medium mb-2 login-label">Benutzer</label>
        <input id="email" formControlName="email" type="text" placeholder="E-Mail-Adresse" pInputText pAutoFocus
          class="w-full mb-3 login-input" />
        <div class="login-error-wrap">
          @if (email.hasError('required') && submitted) {
            <small class="login-error">E-Mail-Adresse
            ist erforderlich</small>
          }
        </div>
      </div>
      <div class="mb-4 login-field">
        <label for="password" class="block text-900 font-medium mb-2 login-label">Passwort</label>
        <input id="password" formControlName="password" type="password" placeholder="Passwort" pInputText
          class="w-full mb-3 login-input" />
        <div class="login-error-wrap">
          @if (password.hasError('required') && submitted) {
            <small class="login-error">Passwort
            ist erforderlich</small>
          }
        </div>
      </div>
      <div class="flex align-items-center justify-content-between mb-4 login-link-row">
        <a (click)="resetPasswort()"
        class="font-medium no-underline ml-2 text-right cursor-pointer login-link">Passwort vergessen?</a>
      </div>
      <div class="card flex justify-content-center mb-4 login-actions-wrap">
        <div class="flex gap-3 login-actions">
          <p-button styleClass="login-primary-button" pRipple
            label="Einloggen" icon="pi pi-sign-in" iconPos="left" [loading]="loading" (click)="login()">
          </p-button>
          <p-button severity="danger" styleClass="login-secondary-button" [routerLink]="['/register']">
            Registrieren
          </p-button>
        </div>
      </div>
    </form>
  } @else {
    <app-loading-spinner></app-loading-spinner>
  }


</app-auth-container>
