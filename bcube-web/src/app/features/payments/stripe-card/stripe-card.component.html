<div class="stripe-card-wrap">
  <div #cardElement class="stripe-card-element"></div>

  @if (cardError) {
    <small class="card-error">{{ cardError }}</small>
  }

  <button
    pButton
    type="button"
    class="w-full pay-button"
    [disabled]="submitting"
    (click)="confirmPayment()">
    {{ submitting ? 'Wird verarbeitet…' : submitLabel }}
  </button>
</div>
