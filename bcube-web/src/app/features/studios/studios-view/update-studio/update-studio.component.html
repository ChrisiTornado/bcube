<div class="card flex justify-content-center">
  @if (!detailMode) {
    <p-button
      (click)="openDialog()"
      icon="pi pi-pencil"
      [style]="darkButtonStyle"
      ariaLabel="Cube bearbeiten"
    styleClass="p-button-secondary"></p-button>
  }

  @if (detailMode) {
    <p-button
      (click)="openDialog()"
      icon="pi pi-pencil"
      label="Aktualisieren"
    severity="danger"></p-button>
  }

  <p-dialog header="Cube aktualisieren" [(visible)]="visible" [modal]="true" [style]="{ width: '50vw' }"
    [draggable]="false" [resizable]="false" (onHide)="closeDialog()">
    <form [formGroup]="createForm" class="studio-update-form">
      <app-studio-form-fields
        [form]="createForm"
        [submitted]="submitted"
        [pickedImages]="pickedImages"
        (imagesChange)="onImagesChanged($event)">
      </app-studio-form-fields>

      <div class="flex justify-content-end">
        <p-button (click)="submit()"
          pRipple
          label="Speichern"
          [loading]="loading"
          icon="pi pi-save"
        styleClass="studio-update-save-button"></p-button>
      </div>

    </form>
  </p-dialog>
</div>
