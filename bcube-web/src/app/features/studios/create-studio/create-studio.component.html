@if (isAdmin) {
  <div class="card flex justify-content-center">
    <p-button  (click)="openDialog()" pRipple label="Cube anlegen" icon="pi pi-plus" [style]="darkButtonStyle"></p-button>
    <p-dialog header="Cube anlegen" [(visible)]="visible" [modal]="true" [style]="{ width: '50vw' }"
      [draggable]="false" [resizable]="false" (onHide)="closeDialog()">
      <form [formGroup]="createForm" class="studio-create-form">
        <app-studio-form-fields
          [form]="createForm"
          [submitted]="submitted"
          [pickedImages]="pickedImages"
          [showImageError]="true"
          (imagesChange)="onImagesChanged($event)">
        </app-studio-form-fields>
        <div class="flex justify-content-end">
          <p-button  (click)="submit()" pRipple label="Erstellen" [loading]="loading" icon="pi pi-save"
          [style]="darkButtonStyle"></p-button>
        </div>
      </form>
    </p-dialog>
  </div>
}
