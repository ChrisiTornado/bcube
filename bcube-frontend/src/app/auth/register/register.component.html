<app-auth-container [title]="'Willkommen!'">
  <div class="w-full text-center">
    <img src="assets/images/nice.jpg" alt="FH Logo" class="mb-3 w-6 sm:w-4 inline-block">
  </div>
  <ng-container *ngIf="!loading; else loadingTemplate">
    <form [formGroup]="registerForm">

      <div class="mb-4">
        <label for="email" class="block text-900 font-medium mb-2">E-Mail-Adresse</label>
        <input id="email" formControlName="email" type="text" placeholder="E-Mail-Adresse" pInputText pAutoFocus
          [autofocus]="true" class="w-full mb-3">

        <div style="position: relative">
          <small style="position: absolute; color: red" *ngIf="email.hasError('required') && submitted">E-Mail-Adresse
            ist
            erforderlich</small>
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="block text-900 font-medium mb-2">Passwort</label>
        <input id="password" formControlName="password" type="password" placeholder="Passwort" pInputText
          class="w-full mb-3">

        <div style="position: relative">
          <small style="position: absolute; color: red" *ngIf="password.hasError('required') && submitted">Passwort
            ist erforderlich</small>
        </div>
      </div>


      <div class="mb-4">
        <label for="firstName" class="block text-900 font-medium mb-2">Vorname</label>
        <input id="firstName" formControlName="firstName" type="firstName" placeholder="Vorname" pInputText
          class="w-full mb-3">

        <div style="position: relative">
          <small style="position: absolute; color: red" *ngIf="firstName.hasError('required') && submitted">Vorname
            ist erforderlich</small>
        </div>
      </div>


      <div class="mb-4">
        <label for="lastName" class="block text-900 font-medium mb-2">Nachname</label>
        <input id="lastName" formControlName="lastName" type="lastName" placeholder="Nachname" pInputText
          class="w-full mb-3">

        <div style="position: relative">
          <small style="position: absolute; color: red" *ngIf="lastName.hasError('required') && submitted">Nachname
            ist erforderlich</small>
        </div>
      </div>


      <div class="mb-2">
        <label for="phone" class="block text-900 font-medium mb-2">Telefonnummer</label>
        <input id="phone" formControlName="phone" type="phone" placeholder="Telefonnummer" pInputText
          class="w-full mb-3">

        <div style="position: relative">
          <small style="position: absolute; color: red" *ngIf="phone.hasError('required') && submitted">Telefonnummer
            ist
            erforderlich</small>
        </div>
      </div>

      <div class="card flex justify-content-center mb-4">
        <div class="flex gap-3">
          <p-button pRipple label="Registrieren" icon="pi pi-sign-in" iconPos="left" [loading]="loading"
            (click)="register()"></p-button>
          <p-button [routerLink]="['/login']">Einloggen</p-button>
        </div>
      </div>
    </form>
  </ng-container>

  <ng-template #loadingTemplate>
    <app-loading-spinner></app-loading-spinner>
  </ng-template>

</app-auth-container>
