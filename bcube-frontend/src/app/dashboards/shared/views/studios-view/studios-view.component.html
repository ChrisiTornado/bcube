<div class="view-header flex align-items-center flex-wrap gap-4 mb-4">
    <h1 class="m-0">Cubes</h1>
    <app-studios *ngIf="isAdmin"></app-studios>
</div>

<app-loading-spinner *ngIf="loading$ | async"></app-loading-spinner>

<ng-container *ngIf="!(loading$ | async) && (studios$ | async) as studios">
    <div class="table-shell" style="padding-bottom: 0.5rem;">
        <p-table class="small-rows" [value]="studios ?? []">
            <ng-template pTemplate="header">
                <tr>
                    <th style="width:20%">Cubebild</th>
                    <th pSortableColumn="name" style="width:20%">
                        Name <p-sortIcon field="name"></p-sortIcon>
                    </th>
                    <th style="width:20%">Adresse</th>
                    <th pSortableColumn="country" style="width:20%">
                        Land <p-sortIcon field="country"></p-sortIcon>
                    </th>
                    <th *ngIf="isAdmin">Bearbeiten</th>
                    <th *ngIf="isAdmin">Löschen</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-studio>
                <tr (click)="navigateToDetails(studio)" style="cursor: pointer;">
                    <td>
                        <div class="studio-image-cell">
                            <img [src]="studio.imageBase64" alt="Cubebild">
                        </div>
                    </td>
                    <td>{{ studio.name }}</td>
                    <td>{{ studio.street }}, {{ studio.plz }} {{ studio.city }}</td>
                    <td>{{ studio.country }}</td>

                    <td *ngIf="isAdmin">
                        <div class="studio-action-cell">
                            <app-update-studio [studio]="studio"
                                               (click)="$event.stopPropagation()">
                            </app-update-studio>
                        </div>
                    </td>

                    <td *ngIf="isAdmin">
                        <div class="studio-action-cell">
                            <app-delete-studio [studio]="studio"
                                               (click)="$event.stopPropagation()">
                            </app-delete-studio>
                        </div>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
    <!-- 🔥 Ende Scrollbereich -->

    <!-- Pagination unten fix -->
    <div class="pager-shell flex justify-content-center gap-4 mt-4" *ngIf="totalPages > 1">
        <button pButton label="<- Zurück"
                [style]="{'background-color': 'white', 'border-color': 'black', 'color': 'black'}"
                (click)="loadPage(this.studioService.page - 1)"
                [disabled]="this.studioService.page === 0">
        </button>

        <span class="mt-2 mx-3 font-bold">
            Seite {{ this.studioService.page + 1 }} von {{ totalPages }}
        </span>

        <button pButton label="Weiter ->"
                [style]="{'background-color': 'white', 'border-color': 'black', 'color': 'black'}"
                (click)="loadPage(this.studioService.page + 1)"
                [disabled]="this.studioService.page >= totalPages - 1">
        </button>
    </div>
</ng-container>
