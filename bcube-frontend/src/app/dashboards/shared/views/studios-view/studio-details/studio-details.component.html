<app-loading-spinner *ngIf="loading$ | async"></app-loading-spinner>

<ng-container *ngIf="!(loading$ | async)">
  <ng-container *ngIf="studio">

    <!-- Zurück-Button -->
    <div class="mb-4">
      <button pButton type="button" class="p-button-outlined" icon="pi pi-arrow-left" label="Zurück"
        [style]="{'border-color': 'black', 'color': 'black'}" (click)="goBack()">
      </button>
    </div>

    <!-- Titel + Bild -->
    <div class="flex mb-4 items-center">
      <h2 class="text-2xl font-semibold mb-2">{{ studio.name }}</h2>
      <img [src]="studio.imageBase64" alt="Studiobild"
        style="width: auto; height: 60px; margin-left: 0.75rem; cursor: pointer;"
        (click)="showOverlay(studio.imageBase64)">
    </div>

    <!-- Bild-Overlay -->
    <div *ngIf="overlayVisible" class="overlay" (click)="hideOverlay()">
      <img [src]="overlayImage" alt="Großes Bild" class="overlay-img" (click)="$event.stopPropagation()">
      <button class="close-btn" (click)="hideOverlay()">✖</button>
    </div>

    <!-- Hauptlayout -->
    <div class="studio-layout">

      <!-- Linke Seite -->
      <div class="calendar-section">
        <full-calendar [options]="calendarOptions"></full-calendar>

        <div class="relative">
          <div *ngIf="date" class="absolute mt-2 text-sm text-gray-600">
            Gewähltes Datum: {{ date | date: 'fullDate' }}
          </div>
        </div>

        <div class="booking-elements mt-6" *ngIf="isUser">

          <!-- Startzeit -->
          <div class="items-center mb-3">
            <label for="startTime" class="font-medium">Startzeitpunkt:</label>
            <p-calendar class="ml-3" id="startTime" [(ngModel)]="startTime" [timeOnly]="true" hourFormat="24"
              [stepMinute]="15" placeholder="Startzeit wählen" [showIcon]="true" (onFocus)="setDefaultTime('start')"
              (onSelect)="startTime = normalizeToQuarterHour(startTime)">
            </p-calendar>
          </div>

          <!-- Endzeit -->
          <div class="items-center mb-3">
            <label for="endTime" class="font-medium">Endzeitpunkt:</label>
            <p-calendar class="ml-4" id="endTime" [(ngModel)]="endTime" [timeOnly]="true" hourFormat="24"
              [stepMinute]="15" placeholder="Endzeit wählen" [showIcon]="true" (onFocus)="setDefaultTime('end')"
              (onSelect)="endTime = normalizeToQuarterHour(endTime)">
            </p-calendar>
          </div>

          <!-- Fehlermeldung -->
          <p class="p-error text-sm mt-1" *ngIf="!isEndTimeValid()">
            Endzeit muss nach der Startzeit liegen.
          </p>

          <p class="p-error text-sm mt-1" *ngIf="date && startTime && endTime && isBookingInPast()">
            Diese Uhrzeit ist bereits abgelaufen.
          </p>

          <!-- Button -->
          <div class="mt-5 flex justify-center">
            <button pButton type="button" label="Studio buchen" [disabled]="!canBook()"
              [style]="{'background-color': 'black', 'border-color': 'black', 'color': 'white'}"
              (click)="confirmBooking()">
            </button>
          </div>
        </div>
      </div>

      <!-- Rechte Seite -->
      <p-card class="info-card bg-gray-100 rounded-lg shadow-sm" [style]="{ overflow: 'hidden' }">
        <ng-template pTemplate="title">Studioübersicht</ng-template>
        <p><strong>Beschreibung:</strong> {{ studio.description }}</p>
        <p><strong>Adresse:</strong> {{ studio.street }}, {{ studio.plz }} {{ studio.city }}</p>
        <p><strong>Land:</strong> {{ studio.country }}</p>
      </p-card>
    </div>
  </ng-container>
</ng-container>
