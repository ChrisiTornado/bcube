<app-loading-spinner *ngIf="loading$ | async"></app-loading-spinner>

<ng-container *ngIf="!(loading$ | async)">
  <ng-container *ngIf="booking">
    <h2>Buchungsnummer: {{ booking.id }}</h2>
    <p><strong>Tag:</strong> {{ booking.date | date: 'dd.MM.yyyy'}}</p>
    <p><strong>Uhrzeit:</strong> {{ booking.startTime | date: 'HH:mm' }}-{{ booking.endTime | date: 'HH:mm'}}</p>
    <p><strong>Status:</strong> {{ booking.status }}</p>
  </ng-container>
</ng-container>
