# Full stack: frontend, gateway, services and databases.
# The databases (and their volumes/network) are defined once in bcube-services/docker-compose.yml;
# for development run only those from that folder and start the services from your IDE.
include:
  - path: ./bcube-services/docker-compose.yml
    env_file: ./.env # same DB_USER / DB_PASSWORD for the containers and the datasources below

services:
  frontend:
    build: ./bcube-web
    container_name: frontend
    ports:
      - "4200:80"
    depends_on:
      - api-gateway
    networks:
      - bcube-network

  api-gateway:
    build: ./bcube-services/api-gateway
    container_name: api-gateway
    environment:
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: http://user-service:8081
      STUDIO_SERVICE_URL: http://studio-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8085
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - studio-service
      - booking-service
      - access-service
      - payment-service
    networks:
      - bcube-network

  user-service:
    build: ./bcube-services/user-service
    container_name: user-service
    env_file:
      - ./bcube-services/user-service/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/bcube_user_service
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    ports:
      - "8081:8081"
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - bcube-network

  studio-service:
    build: ./bcube-services/studio-service
    container_name: studio-service
    env_file:
      - ./bcube-services/studio-service/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://studio-db:5432/bcube_studio_service
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8082:8082"
    depends_on:
      studio-db:
        condition: service_healthy
    networks:
      - bcube-network

  booking-service:
    build: ./bcube-services/booking-service
    container_name: booking-service
    env_file:
      - ./bcube-services/booking-service/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://booking-db:5432/bcube_booking_service
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    ports:
      - "8083:8083"
    depends_on:
      booking-db:
        condition: service_healthy
    networks:
      - bcube-network

  access-service:
    build: ./bcube-services/access-service
    container_name: access-service
    env_file:
      - ./bcube-services/access-service/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://access-db:5432/bcube_access_service
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: docker
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    ports:
      - "8084:8084"
    depends_on:
      access-db:
        condition: service_healthy
    networks:
      - bcube-network

  payment-service:
    build: ./bcube-services/payment-service
    container_name: payment-service
    env_file:
      - ./bcube-services/payment-service/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/bcube_payment_service
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    ports:
      - "8085:8085"
    depends_on:
      payment-db:
        condition: service_healthy
    networks:
      - bcube-network
